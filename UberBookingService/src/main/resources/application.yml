server:
  port: 7477

spring:
  application:
    name: UberBookingService
  kafka:
    bootstrap-servers: uber-kafka:9092
  datasource:
    url: jdbc:mysql://mysql:3306/uber_db_local?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "sahil#123"
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        hbm2ddl.auto: none
  main:
    allow-bean-definition-overriding: true
  flyway:
    enabled: false

# Configure location-service base URL for Docker network
location-service:
  baseUrl: http://location-service:8080

eureka:
  client:
    service-url:
      defaultZone: http://service-discovery:8761/eureka/
  instance:
    prefer-ip-address: true
