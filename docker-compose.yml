networks:
  uber-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:

services:
  # --------------------------------------------------
  # 1. SERVICE DISCOVERY (EUREKA SERVER)
  # --------------------------------------------------
  service-discovery:
    build:
      context: .
      dockerfile: UberServiceDiscovery/Dockerfile
    container_name: uber-service-discovery
    ports:
      - "8761:8761"
    networks:
      - uber-network

  # --------------------------------------------------
  # 2. DATABASES & CACHE
  # --------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: uber-mysql
    command: --bind-address=0.0.0.0
    environment:
      MYSQL_ROOT_PASSWORD: "sahil#123"
      MYSQL_DATABASE: uber_db_local
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - uber-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-psahil#123",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: uber-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - uber-network

  # --------------------------------------------------
  # 3. MESSAGE BROKER (KAFKA IN KRAFT MODE - NO ZOOKEEPER)
  # --------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: uber-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://13.206.122.90:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_KEY_CONVERTER: "org.apache.kafka.connect.storage.StringConverter"
      KAFKA_VALUE_CONVERTER: "org.apache.kafka.connect.storage.StringConverter"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    networks:
      - uber-network

  # --------------------------------------------------
  # 4. MICROSERVICES
  # --------------------------------------------------
  entity-service:
    build:
      context: .
      dockerfile: UberProject-EntityService/Dockerfile
    container_name: uber-entity-service
    ports:
      - "8082:8082"
    networks:
      - uber-network

  auth-service:
    build:
      context: .
      dockerfile: UberProject-AuthService-master/Dockerfile
    container_name: uber-auth-service
    ports:
      - "8080:8080"
    networks:
      - uber-network

  booking-service:
    build:
      context: .
      dockerfile: UberBookingService/Dockerfile
    container_name: uber-booking-service
    ports:
      - "7477:7477"
    depends_on:
      mysql:
        condition: service_healthy
      service-discovery:
        condition: service_started
    networks:
      - uber-network

  socket-server:
    build:
      context: .
      dockerfile: UberSocketServer/Dockerfile
    container_name: uber-socket-server
    ports:
      - "7779:7779"
    networks:
      - uber-network

  location-service:
    build:
      context: .
      dockerfile: UberProject-LocationService/Dockerfile
    container_name: uber-location-service
    networks:
      - uber-network

  review-service:
    build:
      context: .
      dockerfile: UberReviewService/Dockerfile
    container_name: uber-review-service
    networks:
      - uber-network
